<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M2 14 C6 10 6 6 14 2' stroke='%23ffb000' stroke-width='3' fill='none'/%3E%3C/svg%3E" />
    <title>Trapla — road design on real terrain</title>
  </head>
  <body>
    <div id="app">
      <div id="view">
        <div id="overlay"></div>
        <div id="brand">Trapla <small>prototype</small></div>
        <div id="editbar"></div>
        <div id="viewbar"></div>
        <div id="legend">
          <span><i style="background:#ffb000"></i>road</span>
          <span><i style="background:#2f8fff"></i>bridge</span>
          <span><i style="background:#a070ff"></i>tunnel</span>
          <span><i style="background:transparent;border:2px solid #167d9a;width:7px;height:7px;border-radius:50%"></i>culvert</span>
          <span><i style="background:#ff2a2a"></i>violation</span>
          <span><i class="wall"></i>noise wall</span>
          <span><i style="background:#d7301f;width:7px;height:7px;border-radius:0"></i>demolished (footprint)</span>
          <span><i class="diamond"></i>bought out (noise)</span>
          <span><i class="dash"></i><span id="legend-official">official line</span></span>
        </div>
        <div id="attrib"></div>
        <div id="status">loading…</div>
      </div>
      <div id="profile">
        <div class="profile-bar"><b>Longitudinal profile</b> <span class="legend"><span class="sw bendmk">1</span>bend (as on the map) <span class="lg-hp"><span class="sw hp"></span>height point</span> <span class="sw pinmk"></span>pinned height <span class="sw ground"></span>ground <span class="sw road"></span>road height <span class="sw fill"></span>embankment <span class="sw cut"></span>cut <span class="sw br"></span>bridge <span class="sw tn"></span>tunnel</span>
          <span class="zoom" role="group" aria-label="Profile zoom"><button id="fit" title="Zoom out to the whole route" hidden>⤢ Whole route</button><button id="zoom-out" title="Zoom out (or turn the mouse wheel over the profile)">−</button><button id="zoom-in" title="Zoom in (or click the profile where you want to look closer)">+</button></span></div>
        <canvas id="profile-canvas"></canvas>
      </div>
      <aside id="hud"></aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
