# Trapla on a VPS with nginx (docs/deploy.md): include in http { }, copy dist/ to /var/www/trapla (deploy/rsync.sh).
server {
    listen 443 ssl;
    http2 on;
    server_name trapla.example.org;
    # ssl_certificate / ssl_certificate_key: e.g. from certbot
    root /var/www/trapla;
    # (an add_header inside a location drops the server's: each location repeats nosniff)

    # JSON / JS / CSS / HTML compressed on the way; the *.gz packs are already compressed and not listed here
    gzip on;
    gzip_types application/json text/css application/javascript text/javascript image/svg+xml;

    # content-hashed names never change: cached for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location /scenarios/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        # *.gz as plain bytes (no Content-Encoding): the game unpacks them; it also copes with a host that does
        types { application/octet-stream gz; application/json json; }
        try_files $uri =404;
    }
    # the pages are revalidated on every visit, so a new deploy shows at once
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
}
# Under a sub-path (location /trapla/ { alias /var/www/trapla/; … }) works the same: all URLs in the build are
# relative. Redirect /trapla to /trapla/ (relative URLs need the trailing slash).
